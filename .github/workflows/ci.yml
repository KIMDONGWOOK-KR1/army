name: PR validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_BACKEND: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Check Edge function
        run: deno check --no-lock supabase/functions/game/index.ts supabase/functions/_shared/prepare-seed-course.ts supabase/functions/_shared/project-course-v2.ts
      - name: Lint v2 shared engine
        run: deno lint supabase/functions/_shared/engine-v2.ts supabase/functions/_shared/game-core.ts supabase/functions/_shared/demo-course-v2.ts supabase/functions/_shared/legacy-demo-course-v2.ts supabase/functions/_shared/project-journal-v2.ts supabase/functions/_shared/answer-v2.ts supabase/functions/_shared/prepare-course-v2.ts supabase/functions/_shared/project-course-v2.ts supabase/functions/_shared/types.ts
